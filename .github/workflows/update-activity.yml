name: Update engineering telemetry

on:
  schedule:
    # 11:15 UTC is 06:15 in Houston during Central Daylight Time.
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engineering-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: vasamsettyvinay01-beep
          outputs: |
            assets/activity/contribution-snake.gif?color_snake=#9470FF&color_dots=#0B1323,#123044,#1A6F8A,#00C2D6,#00E5FF&color_background=#070B14
            assets/activity/contribution-snake.svg?color_snake=#9470FF&color_dots=#0B1323,#123044,#1A6F8A,#00C2D6,#00E5FF&color_background=#070B14

      - name: Give the snake a solid background
        run: node scripts/polish-snake.mjs

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: vasamsettyvinay01-beep
          SETTING_JSON: assets/activity/profile-3d.settings.json

      - name: Move 3D graph into activity assets
        run: |
          test -f profile-3d-contrib/profile-3d.svg
          mv profile-3d-contrib/profile-3d.svg assets/activity/profile-3d.svg
          rm -rf profile-3d-contrib

      - name: Generate telemetry cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-telemetry.mjs

      - name: Commit refreshed assets
        run: |
          git add assets/activity
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh public engineering telemetry"
            git push
          fi
