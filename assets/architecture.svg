<text x="830" y="497" fill="#EDF7FF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Tools / External Systems</text>
<text x="798" y="518" fill="#93A9BF" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Actions outside the model</text>
